<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiskLens — see what's eating your disk</title>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%234c8dff' stroke-width='3'/><circle cx='16' cy='16' r='5' fill='%234c8dff'/></svg>">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/>
      </svg>
      <a href="/">DiskLens</a>
    </div>

    <div class="scanbox">
      <div class="pathfield">
        <svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        </svg>
        <input id="pathInput" type="text" spellcheck="false" placeholder="/ for the whole Mac, or any folder…" aria-label="Scan path">
      </div>
      <button class="btn" id="browseBtn" title="Choose a folder">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        </svg>
        Choose
      </button>
      <button class="btn primary" id="scanBtn">Scan</button>
      <button class="btn" id="refreshBtn" title="Re-scan the same path" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>
        </svg>
      </button>
    </div>

    <div class="themebox">
      <div class="seg" id="themeSeg"></div>
      <div class="seg" id="modeSeg"></div>
    </div>

    <div class="disk-gauge" id="gauge">
      <div class="gauge-meter"><div class="gauge-fill" id="gaugeFill" style="width:0%;background:#4c8dff"></div></div>
      <div class="gauge-text" id="gaugeText">—</div>
    </div>
  </header>

  <div class="body">

    <nav class="rail">
      <h4>Views</h4>
      <div id="railViews"></div>
      <h4>Find</h4>
      <div id="railTools"></div>
      <h4>Manage</h4>
      <div id="railManage"></div>
      <h4>Recent scans</h4>
      <div id="railScans"></div>
    </nav>

    <main class="stage">
      <div class="stage-head">
        <button class="btn icon small" id="upBtn" title="Up one level (Esc or right-click)" hidden>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
        <div class="crumbs" id="crumbs"></div>
        <div class="stage-sub" id="stageSub"></div>
        <div class="spacer"></div>
        <div class="seg" id="colorSeg">
          <button data-mode="type" class="on">By type</button>
          <button data-mode="folder">By folder</button>
        </div>
      </div>

      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="viz"></canvas>
        <div class="legend" id="legend"></div>
        <div class="tip" id="tip"></div>
        <div id="panelSlot"></div>
      </div>
    </main>

    <aside class="inspector" id="inspector">
      <div class="insp-empty" id="inspEmpty">
        Click anything in the map to inspect it.<br><br>
        Nothing here deletes files. Items go to a cleanup list you review first.
      </div>
      <div id="inspBody" class="hidden"></div>
    </aside>

  </div>
</div>

<div class="toast-wrap" id="toasts"></div>
<div id="modalSlot"></div>

<script src="/static/theme.js"></script>
<script src="/static/viz.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
